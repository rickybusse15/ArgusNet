[package]
name = "argusnet-sim"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "argusnet_sim"
path = "src/lib.rs"

[dependencies]
argusnet-mapping = { path = "../argusnet-mapping" }
argusnet-planning = { path = "../argusnet-planning" }
argusnet-types = { path = "../argusnet-types" }
safety-engine = { path = "../safety-engine" }
# Pinned deliberately: this crate's output values are a contract. See
# `deterministic.rs` and the conformance fixtures that pin actual draws, which
# are what make a silent change to this dependency fail a test.
# Pinned EXACTLY, like the PRNG above and for the same reason. `normal()`
# routes ln and cos through this rather than through the platform libm,
# because neither is required by IEEE-754 to be correctly rounded and glibc
# on x86_64 disagrees with Apple's libm on arm64 by 1 ULP -- which broke the
# conformance fixture the moment CI moved to a Mac. A version bump here can
# move the draws, so it is pinned and the fixture guards it.
libm = "=0.2.16"
rand_chacha = "=0.10.0"
rand_core = "=0.10.1"
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
