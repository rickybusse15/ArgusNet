[package]
name = "argusnet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# `argusnet-rs`, not `argusnet`: during coexistence pip installs a Python
# `argusnet` console script, and a Cargo binary of the same name would
# overwrite it or be shadowed by it depending on PATH order. DELIVERY_PLAN P4.9.
[[bin]]
name = "argusnet-rs"
path = "src/main.rs"

[dependencies]
argusnet-sim = { path = "../argusnet-sim" }
clap.workspace = true
serde_json.workspace = true
