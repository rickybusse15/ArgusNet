[workspace]
members = [
  "rust/argusnet-types",
  "rust/argusnet-mapping",
  "rust/argusnet-planning",
  "rust/argusnet-localization",
  "rust/argusnet-sensing",
  "rust/argusnet-native",
  "rust/argusnet-world",
  "rust/safety-engine",
  "rust/argusnet-core",
  "rust/argusnet-proto",
  "rust/argusnet-server",
  "rust/argusnet-replay",
  "rust/argusnet-sim",
  "rust/argusnet-viewer",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

# Optimized release binaries (server throughput, viewer frame rate).
# Debug builds — including the test daemon — are unaffected.
[profile.release]
lto = "thin"
codegen-units = 1

# Full DWARF across 721 crates produced ~1.3 GB viewer test binaries. CI links
# two of them (lib test and bin test) on a runner with ~14 GB of free disk, and
# rust-lld died writing its memory-mapped output: "ld terminated with signal 7
# [Bus error]" on #45 and twice on #46.
#
# line-tables-only keeps the file and line numbers that panics, backtraces and
# test failures actually print; it drops the type and variable information a
# step debugger would use. Dependencies are not stepped through at all, so
# their debuginfo is pure cost.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
anyhow = "1.0"
# The viewer is the only consumer today, but these live here with every other
# shared dep so a second crate cannot drift onto a different Bevy.
# default-features = false drops the 2d, ui and audio buckets: the viewer draws
# only 3d and renders its UI through egui. "3d" already brings bevy_gltf,
# bevy_pbr, bevy_gizmos_render, bevy_anti_alias and bevy_post_process.
bevy = { version = "0.19.1", default-features = false, features = ["3d", "png"] }
bevy_egui = "0.42.0"
# procedural.py derives its terrain seeds with blake2b-64, which is a different
# function from sim.py's FNV-1 walk despite sharing the name _stable_seed.
# Hand-rolling a hash for one call site is the kind of thing that is wrong in a
# way no test catches, so this takes the RustCrypto implementation.
blake2 = "0.10"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
criterion = { version = "0.5", features = ["html_reports"] }
# Carries rendered frames from the render world back to the main world for the
# headless renderer; already in the tree as a Bevy dependency.
crossbeam-channel = "0.5"
egui_extras = "0.36"
egui_plot = "0.37"
hdrhistogram = "7"
# `serde-serialize`: checkpoints carry the fusion engine's filter state
# (P4.8e.4), which is nalgebra vectors and matrices.
nalgebra = { version = "0.33", features = ["serde-serialize"] }
prost = "0.14"
prost-types = "0.14"
# `rc`: the fusion engine shares contributor lists behind `Arc`, and a
# checkpoint has to carry them.
serde = { version = "1.0", features = ["derive", "rc"] }
# `float_roundtrip` workspace-wide, not per crate: Cargo unifies features per
# build, so enabling it only on argusnet-sim made `cargo build -p
# argusnet-native` parse floats differently from a workspace build. Checkpoints
# and the scenario bundle need correctly rounded parsing; so does the native ABI,
# which receives every terrain height Python sends over JSON.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_yaml = "0.9"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
protoc-bin-vendored = "3.2"
