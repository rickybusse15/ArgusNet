name: CI
on:
  push:
    branches: [main]
  # Every branch, not just PRs into main: a PR stacked on another feature
  # branch would otherwise get no CI at all, and retargeting it later does not
  # retroactively trigger a run.
  pull_request:
    branches: ['**']

permissions:
  contents: read

# Every job's `runs-on` reads the repository variable `CI_RUNNER`, defaulting
# to GitHub's hosted Linux runners. Set it (Settings -> Secrets and variables
# -> Actions -> Variables) to `self-hosted` to move CI onto your own machine --
# see docs/LOCAL_CI.md. It has to be spelled out per job rather than hoisted
# into a workflow-level `env`, because `runs-on` is evaluated before `env` is
# available to it.
#
# Steps specific to a hosted Ubuntu image are guarded on `runner.os` rather
# than assumed, so the same workflow runs unchanged on a macOS runner.

jobs:
  python-tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned Rust toolchain for native world bindings
        run: rustup show
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src/ tests/
      - name: Format check with ruff
        run: ruff format --check src/ tests/
      - name: Type check with mypy
        run: mypy src/argusnet/ --ignore-missing-imports --follow-imports=skip
      # The Rust bindings are generated by argusnet-proto's build.rs at compile
      # time, so they cannot drift. Python's are committed -- the package ships
      # without a protoc toolchain -- which means a proto edit that forgets to
      # regenerate leaves the two languages silently disagreeing about the wire
      # format. This is the only thing that catches that.
      - name: Protobuf bindings are up to date
        run: python3 scripts/regenerate_proto.py --check
      # G0: a new proto field must arrive with a stated disposition. This does
      # not judge whether the handling is right -- only that someone said what
      # it should be, which is what "no silent missing-field success" needs.
      - name: Proto fields have a recorded disposition
        run: python3 scripts/check_field_parity.py
      - name: Run tests
        run: python -m pytest tests/ -q --timeout=120
      - name: Fast benchmark smoke
        run: python -m pytest tests/benchmarks/ -q -m benchmark_fast --benchmark-only --benchmark-json=bench.json
      # Work counters are deterministic and machine-independent, so this gate
      # runs on every PR. The timing half stays opt-in (ARGUSNET_RUN_PERF_TIMING)
      # because absolute wall-clock baselines do not transfer between runners.
      - name: Performance regression (deterministic work counters)
        run: python -m pytest tests/test_performance_regression.py -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-${{ matrix.python-version }}
          path: bench.json

  # The Rust work is split four ways so a logic error does not wait behind a
  # Bevy build. Only argusnet-viewer depends on Bevy (66 of the 721 locked
  # packages), so every other crate compiles and links without it.
  #
  # These jobs restore a shared cache but only WRITE it on main. PR runs would
  # otherwise each store their own copy of a multi-gigabyte target directory and
  # evict each other from the repository's 10 GB cache quota.
  rust-fast:
    name: rust-fast (no Bevy)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # No apt step: the packages below exist for Bevy's alsa and libudev
      # bindings, and nothing in this job depends on Bevy.
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fast
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --exclude rather than naming crates, so a new workspace member is
      # covered here by default instead of silently going untested.
      - name: Test everything except the viewer
        run: cargo test --workspace --exclude argusnet-viewer

  rust-viewer:
    name: rust-viewer (Bevy + headless render)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Debian-only. A macOS runner links CoreAudio and IOKit instead, and its
      # wgpu backend is Metal, so it needs neither the dev headers nor lavapipe.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libudev/libasound are needed to LINK anything Bevy, rendering or
          # not. mesa-vulkan-drivers supplies lavapipe, a software Vulkan
          # implementation, and is needed only by the render step below: a
          # hosted runner has no GPU and wgpu has no software fallback.
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev mesa-vulkan-drivers
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: viewer
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the viewer
        run: cargo test -p argusnet-viewer
      # Only the viewer binary, not `--workspace`: the old single job built the
      # whole workspace here and then built it again under `cargo test`.
      - name: Build the viewer binary for the render smoke test
        run: cargo build -p argusnet-viewer --bin argusnet-viewer
      # Renders a scene through the real Bevy pipeline with no window. This is
      # the only check that exercises rendering at all: every other test runs
      # logic that never reaches a shader, so a regression that leaves the world
      # invisible passes them all. Kept out of `cargo test` so contributors
      # without a Vulkan driver can still run the suite.
      - name: Headless render smoke test
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/prepare_viewer_smoke_scene.py /tmp/argusnet-render-scene
          # 650 wide, not 640: wgpu pads each readback row out to a 256-byte
          # boundary, and a width divisible by 64 needs no padding at all. Every
          # round width (640, 1280, 1920) falls in that aligned class, so
          # rendering at one leaves the padded path untested -- the path where
          # the readback buffer carries bytes the render never wrote.
          ./target/debug/argusnet-viewer \
            --scene /tmp/argusnet-render-scene \
            --headless \
            --output /tmp/argusnet-headless.png \
            --width 650 --height 480 --camera isometric
          python3 - <<'PY'
          from PIL import Image

          image = Image.open("/tmp/argusnet-headless.png").convert("RGB")
          colors = image.getcolors(maxcolors=1 << 20) or []
          # A render that failed comes back uniform: all zero when the target was
          # never written, or a single clear colour when the camera drew nothing.
          # Real terrain produces thousands of distinct shades.
          top = sorted(colors, reverse=True)[:3]
          assert len(colors) > 50, f"headless render looks empty: {top}"
          # The synthetic replay has a green track. Terrain and blue radar rings
          # alone must not pass when the hologram pipeline fails to draw.
          green_pixels = sum(
              count for count, (r, g, b) in colors
              if g > 100 and g > 1.4 * r and g > 1.4 * b
          )
          assert green_pixels > 30, f"holographic track missing: {green_pixels} green pixels"
          print(f"headless render OK: {len(colors)} distinct colours")
          PY

  rust-lint:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # Debian-only; see the note in rust-viewer.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Linting the viewer still runs the alsa and libudev build scripts, so
          # the dev headers are required. lavapipe is not: nothing renders here.
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          cargo clippy --version
      # Formatting first: it compiles nothing, so a misformatted file fails in
      # seconds instead of behind a full clippy pass.
      - name: Format check
        run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --all-targets so tests, benches and examples are linted too. Without
      # it clippy only sees lib and bin targets, and lint drift accumulates
      # unnoticed in exactly the code nobody re-reads.
      #
      # This type-checks bench code but never codegens or links it. Compiling
      # the benches for real measured 25m27s on the runner -- four times the
      # next slowest job, and the only reason PR CI took 25 minutes rather than
      # 7 -- so that lives in nightly-bench.yml, whose `cargo bench --workspace`
      # builds them anyway. A bench that fails to link now surfaces overnight
      # instead of pre-merge.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # G0's installed-wheel and clean-checkout contract job.
  #
  # Every other job runs from the checkout, where the source tree satisfies
  # imports and data-file lookups that an installed wheel has to provide for
  # itself. That gap is how the replay schema came to ship without the
  # validator that enforces it: `jsonschema` was in the dev extra, so CI
  # validated strictly while an installed package fell back to a hand-written
  # check that misses unknown keys, wrong-typed nested fields and out-of-range
  # values.
  #
  # The runner's checkout is already clean, so building the wheel here is the
  # clean-checkout half; installing it into a fresh venv and running the
  # contract assertions from /tmp is the installed-wheel half.
  packaging-contract:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      # The wheel carries a compiled cdylib, so the pinned toolchain is needed
      # to build it even though nothing here runs cargo directly.
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Build the wheel
        run: |
          python3 -m pip install --upgrade build
          python3 -m build --wheel --outdir dist/ .
      - name: Install it into a clean environment
        run: |
          python3 -m venv /tmp/contract-venv
          /tmp/contract-venv/bin/pip install dist/*.whl
      # Run from /tmp: the script refuses to run inside the source tree, since a
      # checkout on the path would mask the failures it exists to catch.
      - name: Installed package honours its contracts
        run: cd /tmp && /tmp/contract-venv/bin/python "$GITHUB_WORKSPACE/scripts/check_installed_contract.py"

  security:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install dependencies
        run: pip install -e ".[dev]" pip-audit bandit
      # New scanners are non-blocking until an initial pass has triaged any
      # existing findings; flip to blocking (drop continue-on-error) once clean.
      - name: pip-audit (dependency vulnerabilities)
        continue-on-error: true
        run: pip-audit
      - name: bandit (Python static analysis)
        continue-on-error: true
        run: bandit -r src/ -x src/argusnet/v1
      - name: cargo audit (Rust dependency vulnerabilities)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
      # A container action, so it cannot run on a macOS runner at all. Guarded
      # rather than removed: on Linux it still runs exactly as before.
      - name: gitleaks (secret scanning)
        if: runner.os == 'Linux'
        continue-on-error: true
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
