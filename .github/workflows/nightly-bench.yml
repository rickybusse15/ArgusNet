name: Nightly Benchmarks

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: Install Python dependencies
        run: pip install -e ".[dev]"
      # The full-scale run of the numerical-stability stress test. Its
      # defaults are deliberately small so `cargo test` stays fast for
      # contributors; the crowded 150-target association case runs here, which
      # is what the ARGUSNET_STRESS_* env vars were documented for.
      - name: Full-scale tracking stress test
        env:
          ARGUSNET_STRESS_TARGETS: "150"
          ARGUSNET_STRESS_FRAMES: "400"
        run: cargo test -p argusnet-core --lib many_tracks_remain_finite_over_long_run
      - name: Rust criterion benchmarks
        run: cargo bench --workspace
      - name: Python slow benchmark suite
        run: argusnet benchmark --suite slow --seeds 7,42,137,9999,31415 --output bench-out/
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-bench
          path: |
            bench-out/
            target/criterion/
      # TODO: after a week of clean nightly runs, wire red-threshold detection
      # to `gh issue create --label perf-regression`.
